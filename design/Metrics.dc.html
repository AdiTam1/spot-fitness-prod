<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg-canvas:#08090c;--bg-surface-1:#101218;--bg-surface-2:#161922;--bg-surface-3:#1e222e;--bg-glass:#101218d1;--border-subtle:#ffffff0f;--border-strong:#ffffff1f;--border-accent:#d67d0973;--text-primary:#f4f6fb;--text-secondary:#949bb0;--text-muted:#5e6578;--accent-orange:#d67d09;--accent-volt:#d67d09;--accent-orange-bright:#eb931c;--accent-volt-soft:#d67d0924;--orange-0:#fef5e7;--orange-1:#fae8cb;--orange-2:#f4cf97;--orange-3:#eeb45f;--orange-4:#e99c2f;--orange-5:#e68e13;--orange-6:#d67d09;--orange-7:#be6c03;--orange-8:#a95f00;--orange-9:#935000;--macro-protein:#38bdf8;--macro-protein-soft:#38bdf824;--macro-carbs:#ff5e7e;--macro-carbs-soft:#ff5e7e24;--macro-fat:#ff8c1a;--macro-fat-soft:#ff8c1a24;--status-ok:#22c55e;--status-warn:#f59e0b;--status-danger:#ef4444;--shadow-card:inset 0 1px 0 0 rgba(255, 255, 255, 0.05), 0 8px 24px -8px rgba(0, 0, 0, 0.5);--shadow-card-elevated:inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 20px 40px -15px rgba(0, 0, 0, 0.7);--shadow-button-hover:0 6px 20px -4px rgba(214, 125, 9, 0.45);--shadow-dock:0 20px 45px -10px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);--space-xs:10px;--space-sm:12px;--space-md:16px;--space-lg:20px;--space-xl:32px;--radius-sm:12px;--radius-md:20px;--radius-lg:24px;--radius-pill:999px;--font-sans:'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;--font-mono:'Space Grotesk', 'Heebo', sans-serif;}}</style>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Spot Fitness – מדדים</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300..800&amp;family=Space+Grotesk:wght@500..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{--acc:#d67d09;--p:#38bdf8;--c:#ff5e7e;--f:#ff8c1a;font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app.dark{--bg:#000000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f5f5f5;--tx2:#a8a8a8;--tx3:#8e8e93;--inv:#3e3e3f;--invtx:#ffffff;--glass:rgba(44,44,46,.52);--glass-b:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.22);--shadow:0 14px 34px -10px rgba(0,0,0,.8)}
.app.light{--bg:#f2f2f4;--s1:#ffffff;--s2:#f2f2f4;--s3:#e5e5e8;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--tx:#0a0a0a;--tx2:#5a5a5e;--tx3:#6e6e73;--inv:#2c2c2e;--invtx:#ffffff;--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,1);--shadow:0 14px 34px -12px rgba(0,0,0,.22)}
.glass{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.05),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08));pointer-events:none;z-index:-1}
.tint{background:color-mix(in srgb,var(--acc) 88%,transparent);border-color:rgba(255,200,130,.55);color:#0a0a0a}
.num{font-family:'Space Grotesk','Heebo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div class="app {{themeClass}}" dir="rtl" lang="he" style="--acc: {{acc}}; --inv: {{btn}}; --s1: {{card}}; --bg: {{bgc}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--tx)">
<div style="padding: 20px 20px 150px; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 4px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">מדדים</h1>
<a href="{{checkinHref}}" class="glass" style="height: 44px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"></path></svg>צ׳ק-אין שבועי</a>
</header>

<section aria-label="משקל גוף" style="background: var(--s1); border: 1px solid var(--line); border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: var(--tx2)">משקל נוכחי</span>
<span style="display: flex; align-items: baseline; gap: 6px"><span class="num" style="font-size: 40px; font-weight: 700; line-height: 1">82.4</span><span style="font-size: 15px; color: var(--tx2)">ק״ג</span></span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="height: 28px; padding: 0 10px; border-radius: 999px; background: var(--s2); font-size: 12px; display: flex; align-items: center">יעד מאמן: <span class="num" style="font-weight: 700; margin-inline-start: 4px">78</span>&nbsp;ק״ג</span>
<span class="num" style="height: 28px; padding: 0 10px; border-radius: 999px; background: var(--acc); color: #0a0a0a; font-size: 12px; font-weight: 700; display: flex; align-items: center">−2.6 ק״ג מההתחלה</span>
</div>
</div>
<svg viewBox="0 0 350 90" width="100%" height="90" role="img" aria-label="מגמת משקל יורדת ב-8 השקילות האחרונות">
<defs><linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".18"></stop><stop offset="1" stop-color="currentColor" stop-opacity="0"></stop></linearGradient></defs>
<line x1="0" y1="78" x2="350" y2="78" stroke="var(--acc)" stroke-dasharray="4 5" stroke-width="1.2"></line>
<path d="M0 14 L50 20 L100 18 L150 30 L200 34 L250 42 L300 46 L350 52 L350 90 L0 90 Z" fill="url(#wfill)" style="color: var(--tx)"></path>
<path d="M0 14 L50 20 L100 18 L150 30 L200 34 L250 42 L300 46 L350 52" fill="none" stroke="var(--tx)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path>
<circle cx="344" cy="52" r="6" fill="var(--acc)" stroke="var(--s1)" stroke-width="3"></circle>
</svg>
<form style="display: flex; gap: 8px" onSubmit="{{noop}}">
<label for="weigh" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">משקל היום בק״ג</label>
<input id="weigh" inputmode="decimal" placeholder="שקילה של היום (ק״ג)" style="flex: 1; height: 48px; border-radius: 999px; border: 1px solid var(--line2); background: var(--s2); color: var(--tx); font: inherit; font-size: 15px; padding: 0 18px; outline: none">
<button type="submit" style="height: 48px; padding: 0 20px; border-radius: 999px; background: var(--inv); color: var(--invtx); font-size: 15px; font-weight: 700">תיעוד</button>
</form>
</section>

<section aria-label="מאזן נוזלים יומי" style="background: var(--s1); border: 1px solid var(--line); border-radius: 28px; padding: 16px 18px; display: flex; align-items: center; gap: 14px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 600">מאזן נוזלים</span>
<span style="display: flex; align-items: baseline; gap: 6px"><span class="num" style="font-size: 30px; font-weight: 700; line-height: 1">{{cups}}</span><span style="font-size: 13px; color: var(--tx2)">כוסות · {{liters}} ליטר</span></span>
<div aria-hidden="true" style="display: flex; gap: 4px">
<sc-for list="{{cupMarks}}" as="m" hint-placeholder-count="10"><span style="width: 14px; height: 18px; border-radius: 3px 3px 5px 5px; background: {{m.bg}}"></span></sc-for>
</div>
<span style="font-size: 12px; color: var(--tx3)">כל כוס = 250 מ״ל</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<button class="glass tint" aria-label="הוסף כוס" onClick="{{addCup}}" style="width: 56px; height: 56px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; stroke-width: 2.4"><path d="M12 5v14M5 12h14"></path></svg></button>
<button class="glass" aria-label="הורד כוס" onClick="{{removeCup}}" style="width: 56px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.2"><path d="M5 12h14"></path></svg></button>
</div>
</section>

<section aria-label="היקפי גוף" style="background: var(--s1); border: 1px solid var(--line); border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">היקפי גוף</span><span style="font-size: 12px; color: var(--tx2)">עודכן לפני 6 ימים · ס״מ</span></span>
<button class="glass" style="height: 40px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M3 9h18v6H3zM7 9v3M11 9v3M15 9v3M19 9v3"></path></svg>עדכן + מדריך</button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{measures}}" as="ms" hint-placeholder-count="4">
<div style="background: var(--s2); border-radius: 18px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span class="num" style="font-size: 20px; font-weight: 700">{{ms.v}}</span>
<span style="font-size: 12px; color: var(--tx2); text-align: center">{{ms.l}}</span>
</div>
</sc-for>
</div>
</section>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(to top, var(--bg), transparent); pointer-events: none"></div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; align-items: center; gap: 10px">
<nav class="glass" aria-label="ניווט ראשי" style="flex: 1; height: 66px; border-radius: 999px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px; gap: 2px">
<a href="{{journalHref}}" style="border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg><span style="font-size: 11px">יומן</span></a>
<a href="#" aria-current="page" style="border-radius: 999px; background: var(--line2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6"></path></svg><span style="font-size: 11px; font-weight: 600">מדדים</span></a>
<a href="{{profileHref}}" style="border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span style="font-size: 11px">פרופיל</span></a>
</nav>
<a href="{{addHref}}" class="glass tint" aria-label="הוספת ארוחה" style="width: 66px; height: 66px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px; stroke-width: 2.4"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "accent": {"editor": "color", "default": "#d67d09", "options": ["#d67d09", "#eb931c", "#f5f5f5", "#38bdf8"], "section": "צבעים"}, "button": {"editor": "color", "default": "#3e3e3f", "section": "צבעים"}, "card": {"editor": "color", "default": "#1c1c1e", "section": "צבעים"}, "background": {"editor": "color", "default": "#000000", "section": "צבעים"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cups: 6 }; }
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const L = theme === 'light' ? 'Light' : '';
    const cups = this.state.cups;
    const slots = Math.max(10, cups);
    return {
      themeClass: theme,
      acc: this.props.accent ?? '#d67d09',
      btn: this.props.button ?? (theme === 'light' ? '#2c2c2e' : '#3e3e3f'),
      card: this.props.card ?? (theme === 'light' ? '#ffffff' : '#1c1c1e'),
      bgc: this.props.background ?? (theme === 'light' ? '#f2f2f4' : '#000000'),
      journalHref: (L ? 'MainLight' : 'Main') + '.dc.html',
      addHref: 'AddMeal' + L + '.dc.html',
      profileHref: 'Profile' + L + '.dc.html',
      checkinHref: 'CheckIn' + L + '.dc.html',
      noop: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      cups,
      liters: (cups * 0.25).toFixed(2).replace(/\.?0+$/, ''),
      cupMarks: Array.from({ length: slots }, (_, i) => ({ bg: i < cups ? 'var(--acc)' : 'var(--s3)' })),
      addCup: () => this.setState({ cups: cups + 1 }),
      removeCup: () => this.setState({ cups: Math.max(0, cups - 1) }),
      measures: [
        { l: 'חזה', v: '104' },
        { l: 'בטן (פופיק)', v: '91' },
        { l: 'זרוע', v: '36' },
        { l: 'ירך', v: '58' }
      ]
    };
  }
}
</script>
</body>
</html>
