<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg-canvas:#08090c;--bg-surface-1:#101218;--bg-surface-2:#161922;--bg-surface-3:#1e222e;--bg-glass:#101218d1;--border-subtle:#ffffff0f;--border-strong:#ffffff1f;--border-accent:#d67d0973;--text-primary:#f4f6fb;--text-secondary:#949bb0;--text-muted:#5e6578;--accent-orange:#d67d09;--accent-volt:#d67d09;--accent-orange-bright:#eb931c;--accent-volt-soft:#d67d0924;--orange-0:#fef5e7;--orange-1:#fae8cb;--orange-2:#f4cf97;--orange-3:#eeb45f;--orange-4:#e99c2f;--orange-5:#e68e13;--orange-6:#d67d09;--orange-7:#be6c03;--orange-8:#a95f00;--orange-9:#935000;--macro-protein:#38bdf8;--macro-protein-soft:#38bdf824;--macro-carbs:#ff5e7e;--macro-carbs-soft:#ff5e7e24;--macro-fat:#ff8c1a;--macro-fat-soft:#ff8c1a24;--status-ok:#22c55e;--status-warn:#f59e0b;--status-danger:#ef4444;--shadow-card:inset 0 1px 0 0 rgba(255, 255, 255, 0.05), 0 8px 24px -8px rgba(0, 0, 0, 0.5);--shadow-card-elevated:inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 20px 40px -15px rgba(0, 0, 0, 0.7);--shadow-button-hover:0 6px 20px -4px rgba(214, 125, 9, 0.45);--shadow-dock:0 20px 45px -10px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);--space-xs:10px;--space-sm:12px;--space-md:16px;--space-lg:20px;--space-xl:32px;--radius-sm:12px;--radius-md:20px;--radius-lg:24px;--radius-pill:999px;--font-sans:'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;--font-mono:'Space Grotesk', 'Heebo', sans-serif;}}</style>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Spot Fitness – ארוחות שמורות</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300..800&amp;family=Space+Grotesk:wght@500..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{--acc:#d67d09;--p:#38bdf8;--c:#ff5e7e;--f:#ff8c1a;font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app.dark{--bg:#000000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f5f5f5;--tx2:#a8a8a8;--tx3:#8e8e93;--inv:#3e3e3f;--invtx:#ffffff;--glass:rgba(44,44,46,.52);--glass-b:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.22);--shadow:0 14px 34px -10px rgba(0,0,0,.8)}
.app.light{--bg:#f2f2f4;--s1:#ffffff;--s2:#f2f2f4;--s3:#e5e5e8;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--tx:#0a0a0a;--tx2:#5a5a5e;--tx3:#6e6e73;--inv:#2c2c2e;--invtx:#ffffff;--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,1);--shadow:0 14px 34px -12px rgba(0,0,0,.22)}
.glass{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.05),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08));pointer-events:none;z-index:-1}
.num{font-family:'Space Grotesk','Heebo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div class="app {{themeClass}}" dir="rtl" lang="he" style="--acc: {{acc}}; --inv: {{btn}}; --s1: {{card}}; --bg: {{bgc}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--tx); box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 12px">
<a href="{{addHref}}" class="glass" aria-label="חזרה" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M9 6l6 6-6 6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 700">ארוחות שמורות</h1>
</div>
<button class="glass" aria-label="כלים ויחידות מדידה" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 19px; height: 19px"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
</header>

<div style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 6px 0 16px; border-radius: 999px; background: var(--s1); border: 1px solid var(--line)">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: var(--tx3)"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
<label for="sm-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">חיפוש בארוחות שמורות</label>
<input id="sm-q" placeholder="חיפוש בארוחות שמורות…" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--tx); font: inherit; font-size: 15px; outline: none">
<button class="glass" aria-label="חיפוש קולי" style="width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 17px; height: 17px"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
</div>

<div role="tablist" aria-label="סינון" style="display: flex; gap: 8px; overflow: hidden">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="height: 38px; padding: 0 14px; border-radius: 999px; white-space: nowrap; font-size: 14px; font-weight: {{f.fw}}; background: {{f.bg}}; color: {{f.fg}}; border: 1px solid {{f.bd}}">{{f.label}}</button>
</sc-for>
</div>

<article style="background: var(--s1); border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: flex-start; gap: 10px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">פסטה ברוטב עגבניות ועוף</span>
<span style="font-size: 12px; color: var(--tx2)"><span class="num" style="color: var(--tx); font-weight: 600">640</span> קק״ל · ח 44 · פ 78 · ש 14 · 4 מרכיבים</span>
</span>
<button aria-label="הסר ממועדפים" style="width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--acc)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; fill: currentColor"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
</div>
<div style="display: flex; gap: 8px; align-items: center; height: 46px; padding: 0 6px 0 14px; border-radius: 999px; border: 1px solid var(--line2)">
<label for="sm-adj" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">מה השתנה הפעם</label>
<input id="sm-adj" placeholder="מה השתנה הפעם? (למשל: 100 גרם פסטה)" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--tx); font: inherit; font-size: 13px; outline: none">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: var(--acc); margin-inline-end: 8px"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
</div>
<div style="display: flex; gap: 8px">
<a href="{{homeHref}}" style="flex: 1; height: 44px; border-radius: 999px; background: var(--inv); color: var(--invtx); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">טען לארוחה</a>
<button class="glass" style="height: 44px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M4 5h16v11H9l-5 4z"></path></svg>שאל מאמן</button>
</div>
</article>

<sc-for list="{{meals}}" as="m" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 20px; background: var(--s1); border: 1px solid var(--line)">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.name}}</span>
<span style="font-size: 12px; color: var(--tx2)"><span class="num" style="color: var(--tx); font-weight: 600">{{m.kcal}}</span> קק״ל · {{m.meta}}</span>
</span>
<button style="height: 40px; padding: 0 14px; border-radius: 999px; background: var(--s2); font-size: 13px; font-weight: 600">טען</button>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#d67d09","options":["#d67d09","#eb931c","#f5f5f5","#38bdf8"],"section":"צבעים"},"button":{"editor":"color","default":"#3e3e3f","section":"צבעים"},"card":{"editor":"color","default":"#1c1c1e","section":"צבעים"},"background":{"editor":"color","default":"#000000","section":"צבעים"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 0 }; }
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const L = theme === 'light' ? 'Light' : '';
    const labels = ['הכל · 24', 'מועדפות', 'פופולריות', 'היסטוריה', 'התייעצות מאמן'];
    return {
      themeClass: theme,
      acc: this.props.accent ?? '#d67d09',
      btn: this.props.button ?? (theme === 'light' ? '#2c2c2e' : '#3e3e3f'),
      card: this.props.card ?? (theme === 'light' ? '#ffffff' : '#1c1c1e'),
      bgc: this.props.background ?? (theme === 'light' ? '#f2f2f4' : '#000000'),
      addHref: 'AddMeal' + L + '.dc.html',
      homeHref: (L ? 'MainLight' : 'Main') + '.dc.html',
      filters: labels.map((label, i) => {
        const on = i === this.state.f;
        return { label, on: on ? 'true' : 'false', fw: on ? 700 : 500, bg: on ? 'var(--inv)' : 'transparent', fg: on ? 'var(--invtx)' : 'var(--tx)', bd: on ? 'var(--inv)' : 'var(--line2)', pick: () => this.setState({ f: i }) };
      }),
      meals: [
        { name: 'יוגורט חלבון עם גרנולה', kcal: 310, meta: 'נשמר בארוחות שלי' },
        { name: 'חזה עוף, אורז ושעועית ירוקה', kcal: 540, meta: 'נאכל 6 פעמים' },
        { name: 'שייק בננה וחמאת בוטנים', kcal: 380, meta: 'מתאריך 19.11' }
      ]
    };
  }
}
</script>
</body>
</html>
