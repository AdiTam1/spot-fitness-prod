<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg-canvas:#08090c;--bg-surface-1:#101218;--bg-surface-2:#161922;--bg-surface-3:#1e222e;--bg-glass:#101218d1;--border-subtle:#ffffff0f;--border-strong:#ffffff1f;--border-accent:#d67d0973;--text-primary:#f4f6fb;--text-secondary:#949bb0;--text-muted:#5e6578;--accent-orange:#d67d09;--accent-volt:#d67d09;--accent-orange-bright:#eb931c;--accent-volt-soft:#d67d0924;--orange-0:#fef5e7;--orange-1:#fae8cb;--orange-2:#f4cf97;--orange-3:#eeb45f;--orange-4:#e99c2f;--orange-5:#e68e13;--orange-6:#d67d09;--orange-7:#be6c03;--orange-8:#a95f00;--orange-9:#935000;--macro-protein:#38bdf8;--macro-protein-soft:#38bdf824;--macro-carbs:#ff5e7e;--macro-carbs-soft:#ff5e7e24;--macro-fat:#ff8c1a;--macro-fat-soft:#ff8c1a24;--status-ok:#22c55e;--status-warn:#f59e0b;--status-danger:#ef4444;--shadow-card:inset 0 1px 0 0 rgba(255, 255, 255, 0.05), 0 8px 24px -8px rgba(0, 0, 0, 0.5);--shadow-card-elevated:inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 20px 40px -15px rgba(0, 0, 0, 0.7);--shadow-button-hover:0 6px 20px -4px rgba(214, 125, 9, 0.45);--shadow-dock:0 20px 45px -10px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);--space-xs:10px;--space-sm:12px;--space-md:16px;--space-lg:20px;--space-xl:32px;--radius-sm:12px;--radius-md:20px;--radius-lg:24px;--radius-pill:999px;--font-sans:'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;--font-mono:'Space Grotesk', 'Heebo', sans-serif;}}</style>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Spot Fitness – סריקת ברקוד</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300..800&amp;family=Space+Grotesk:wght@500..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{--acc:#d67d09;--p:#38bdf8;--c:#ff5e7e;--f:#ff8c1a;font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app.dark{--bg:#000000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f5f5f5;--tx2:#a8a8a8;--tx3:#8e8e93;--inv:#3e3e3f;--invtx:#ffffff;--glass:rgba(44,44,46,.52);--glass-b:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.22);--shadow:0 14px 34px -10px rgba(0,0,0,.8)}
.app.light{--bg:#f2f2f4;--s1:#ffffff;--s2:#f2f2f4;--s3:#e5e5e8;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--tx:#0a0a0a;--tx2:#5a5a5e;--tx3:#6e6e73;--inv:#2c2c2e;--invtx:#ffffff;--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,1);--shadow:0 14px 34px -12px rgba(0,0,0,.22)}
.photo-glass{position:relative;isolation:isolate;background:rgba(30,30,30,.42);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px -6px rgba(0,0,0,.6);color:#fff}
.num{font-family:'Space Grotesk','Heebo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div class="app {{themeClass}}" dir="rtl" lang="he" style="--acc: {{acc}}; --inv: {{btn}}; --s1: {{card}}; --bg: {{bgc}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: #0b0b0b; color: var(--tx)">

<div role="img" aria-label="תצוגת מצלמה לסריקת ברקוד" style="position: absolute; top: 0; left: 0; right: 0; height: 470px; background: radial-gradient(circle at 50% 45%, #2b2b2b, #0b0b0b 75%)">
<div aria-hidden="true" style="position: absolute; top: 150px; left: 55px; width: 280px; height: 170px">
<span style="position: absolute; top: 0; right: 0; width: 34px; height: 34px; border-top: 3px solid #fff; border-right: 3px solid #fff; border-radius: 0 14px 0 0"></span>
<span style="position: absolute; top: 0; left: 0; width: 34px; height: 34px; border-top: 3px solid #fff; border-left: 3px solid #fff; border-radius: 14px 0 0 0"></span>
<span style="position: absolute; bottom: 0; right: 0; width: 34px; height: 34px; border-bottom: 3px solid #fff; border-right: 3px solid #fff; border-radius: 0 0 14px 0"></span>
<span style="position: absolute; bottom: 0; left: 0; width: 34px; height: 34px; border-bottom: 3px solid #fff; border-left: 3px solid #fff; border-radius: 0 0 0 14px"></span>
<div style="position: absolute; top: 40px; left: 50px; right: 50px; height: 90px; background: repeating-linear-gradient(90deg, #e9e9e9 0 3px, transparent 3px 6px, #e9e9e9 6px 7px, transparent 7px 11px); opacity: .55; border-radius: 4px"></div>
<span style="position: absolute; top: 84px; left: 18px; right: 18px; height: 2px; background: var(--acc); box-shadow: 0 0 12px var(--acc)"></span>
</div>
<span style="position: absolute; top: 340px; left: 0; right: 0; text-align: center; font-size: 13px; color: rgba(255,255,255,.8)">כוון את המצלמה לברקוד שעל האריזה</span>
<div style="position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between">
<a href="{{addHref}}" class="photo-glass" aria-label="סגירה" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.2"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<button class="photo-glass" aria-label="פנס" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M8 3h8l-2 6v12h-4V9z"></path></svg></button>
</div>
</div>

<section style="position: absolute; left: 0; right: 0; bottom: 0; top: 420px; background: var(--s1); border-radius: 32px 32px 0 0; padding: 22px 20px 26px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: var(--s2); display: flex; align-items: center; justify-content: center; flex: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5h3M17 5h3v2M20 17v2h-3M7 19H4v-2M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: var(--tx2)">נמצא במאגר · 7290011…</span>
<span style="font-size: 17px; font-weight: 700">יוגורט PRO 20 גרם חלבון</span>
</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span><span class="num" style="font-size: 32px; font-weight: 700">132</span> <span style="font-size: 13px; color: var(--tx2)">קק״ל · ח 20 · פ 8 · ש 2</span></span>
<span style="display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--s2)">
<button aria-label="פחות" style="width: 38px; height: 38px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.2"><path d="M5 12h14"></path></svg></button>
<span class="num" style="min-width: 60px; text-align: center; font-size: 14px; font-weight: 600">1 גביע</span>
<button aria-label="יותר" style="width: 38px; height: 38px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.2"><path d="M12 5v14M5 12h14"></path></svg></button>
</span>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<label for="bc-manual" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">הזנת ברקוד ידנית</label>
<input id="bc-manual" inputmode="numeric" placeholder="או הזן מספר ברקוד ידנית" style="flex: 1; height: 46px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--tx); font: inherit; font-size: 14px; padding: 0 16px; outline: none">
</div>
<a href="{{homeHref}}" style="margin-top: auto; height: 56px; border-radius: 999px; background: var(--inv); color: var(--invtx); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">הוסף לארוחה</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#d67d09","options":["#d67d09","#eb931c","#f5f5f5","#38bdf8"],"section":"צבעים"},"button":{"editor":"color","default":"#3e3e3f","section":"צבעים"},"card":{"editor":"color","default":"#1c1c1e","section":"צבעים"},"background":{"editor":"color","default":"#000000","section":"צבעים"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const L = theme === 'light' ? 'Light' : '';
    return {
      themeClass: theme,
      acc: this.props.accent ?? '#d67d09',
      btn: this.props.button ?? (theme === 'light' ? '#2c2c2e' : '#3e3e3f'),
      card: this.props.card ?? (theme === 'light' ? '#ffffff' : '#1c1c1e'),
      bgc: this.props.background ?? (theme === 'light' ? '#f2f2f4' : '#000000'),
      addHref: 'AddMeal' + L + '.dc.html',
      homeHref: (L ? 'MainLight' : 'Main') + '.dc.html'
    };
  }
}
</script>
</body>
</html>
