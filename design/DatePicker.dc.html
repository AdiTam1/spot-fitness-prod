<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg-canvas:#08090c;--bg-surface-1:#101218;--bg-surface-2:#161922;--bg-surface-3:#1e222e;--bg-glass:#101218d1;--border-subtle:#ffffff0f;--border-strong:#ffffff1f;--border-accent:#d67d0973;--text-primary:#f4f6fb;--text-secondary:#949bb0;--text-muted:#5e6578;--accent-orange:#d67d09;--accent-volt:#d67d09;--accent-orange-bright:#eb931c;--accent-volt-soft:#d67d0924;--orange-0:#fef5e7;--orange-1:#fae8cb;--orange-2:#f4cf97;--orange-3:#eeb45f;--orange-4:#e99c2f;--orange-5:#e68e13;--orange-6:#d67d09;--orange-7:#be6c03;--orange-8:#a95f00;--orange-9:#935000;--macro-protein:#38bdf8;--macro-protein-soft:#38bdf824;--macro-carbs:#ff5e7e;--macro-carbs-soft:#ff5e7e24;--macro-fat:#ff8c1a;--macro-fat-soft:#ff8c1a24;--status-ok:#22c55e;--status-warn:#f59e0b;--status-danger:#ef4444;--shadow-card:inset 0 1px 0 0 rgba(255, 255, 255, 0.05), 0 8px 24px -8px rgba(0, 0, 0, 0.5);--shadow-card-elevated:inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 20px 40px -15px rgba(0, 0, 0, 0.7);--shadow-button-hover:0 6px 20px -4px rgba(214, 125, 9, 0.45);--shadow-dock:0 20px 45px -10px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);--space-xs:10px;--space-sm:12px;--space-md:16px;--space-lg:20px;--space-xl:32px;--radius-sm:12px;--radius-md:20px;--radius-lg:24px;--radius-pill:999px;--font-sans:'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;--font-mono:'Space Grotesk', 'Heebo', sans-serif;}}</style>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Spot Fitness – בחירת תאריך</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300..800&amp;family=Space+Grotesk:wght@500..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{--acc:#d67d09;--p:#38bdf8;--c:#ff5e7e;--f:#ff8c1a;font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app.dark{--bg:#000000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f5f5f5;--tx2:#a8a8a8;--tx3:#8e8e93;--inv:#3e3e3f;--invtx:#ffffff;--glass:rgba(44,44,46,.52);--glass-b:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.22);--shadow:0 14px 34px -10px rgba(0,0,0,.8);--scrim:rgba(0,0,0,.55)}
.app.light{--bg:#f2f2f4;--s1:#ffffff;--s2:#f2f2f4;--s3:#e5e5e8;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--tx:#0a0a0a;--tx2:#5a5a5e;--tx3:#6e6e73;--inv:#2c2c2e;--invtx:#ffffff;--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,1);--shadow:0 14px 34px -12px rgba(0,0,0,.22);--scrim:rgba(20,20,22,.28)}
.glass{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.05),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08));pointer-events:none;z-index:-1}
.num{font-family:'Space Grotesk','Heebo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div class="app {{themeClass}}" dir="rtl" lang="he" style="--acc: {{acc}}; --inv: {{btn}}; --s1: {{card}}; --bg: {{bgc}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--tx)">
<div aria-hidden="true" style="position: absolute; inset: 0; filter: blur(3px); transform: scale(1.03)">
<dc-import name="Main" theme="{{themeClass}}" accent="{{acc}}" button="{{btn}}" card="{{card}}" background="{{bgc}}" hint-size="390px,844px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>

<section role="dialog" aria-label="בחירת תאריך" style="position: absolute; left: 0; right: 0; bottom: 0; top: 150px; background: var(--s1); border-radius: 36px 36px 0 0; border-top: 1px solid var(--line2); padding: 10px 20px 26px; display: flex; flex-direction: column; gap: 16px">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 9px; background: var(--s3)"></div>

<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">בחר תאריך</h1>
<span style="font-size: 12px; color: var(--tx2)">ימים פעילים נקבעים ע״י המאמן</span>
</div>
<a href="{{homeHref}}" class="glass" aria-label="סגירה" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.2"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<button class="glass" aria-label="{{prevLabel}}" onClick="{{prev}}" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M9 6l6 6-6 6"></path></svg></button>
<button aria-expanded="{{pickerOpen}}" onClick="{{toggleView}}" style="height: 44px; padding: 0 16px; border-radius: 999px; background: var(--s2); display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700">{{title}}<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; transform: {{chevRot}}"><path d="M6 9l6 6 6-6"></path></svg></button>
<button class="glass" aria-label="{{nextLabel}}" onClick="{{next}}" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M15 6l-6 6 6 6"></path></svg></button>
</div>

<sc-if value="{{isDays}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; color: var(--tx3)">
<span>א׳</span><span>ב׳</span><span>ג׳</span><span>ד׳</span><span>ה׳</span><span>ו׳</span><span>ש׳</span>
</div>
<div role="grid" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<button disabled="{{c.disabled}}" aria-label="{{c.aria}}" onClick="{{c.pick}}" style="height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; visibility: {{c.vis}}">
<span class="num" style="width: 38px; height: 38px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: {{c.fw}}; background: {{c.bg}}; color: {{c.fg}}; border: 1.5px {{c.bs}} {{c.bc}}; text-decoration: {{c.td}}; box-sizing: border-box">{{c.n}}</span>
<span style="width: 4px; height: 4px; border-radius: 9px; background: {{c.dot}}"></span>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--tx2)">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 4px; height: 4px; border-radius: 9px; background: var(--tx2)"></span>יש תיעוד</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 99px; border: 1.5px dashed var(--tx2); box-sizing: border-box"></span>יום תשקיף</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="text-decoration: line-through; color: var(--tx3)">13</span>חסום להזנה</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 99px; border: 1.5px solid var(--tx); box-sizing: border-box"></span>היום</span>
</div>
</sc-if>

<sc-if value="{{isMonths}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div role="radiogroup" aria-label="שנה" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{years}}" as="y" hint-placeholder-count="3">
<button role="radio" aria-checked="{{y.on}}" onClick="{{y.pick}}" class="num" style="height: 44px; border-radius: 14px; font-size: 16px; font-weight: 700; background: {{y.bg}}; color: {{y.fg}}">{{y.y}}</button>
</sc-for>
</div>
<div role="radiogroup" aria-label="חודש" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{months}}" as="m" hint-placeholder-count="12">
<button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="height: 56px; border-radius: 18px; font-size: 15px; font-weight: {{m.fw}}; background: {{m.bg}}; color: {{m.fg}}; border: 1px solid {{m.bd}}">{{m.name}}</button>
</sc-for>
</div>
<span style="font-size: 12px; color: var(--tx3)">חודשים מעומעמים נמצאים מחוץ לחלון הפעיל שהגדיר המאמן</span>
</div>
</sc-if>

<div style="margin-top: auto; display: flex; gap: 10px">
<button class="glass" onClick="{{goToday}}" style="height: 54px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 600; flex: none">חזור להיום</button>
<a href="{{homeHref}}" style="flex: 1; height: 54px; border-radius: 999px; background: var(--inv); color: var(--invtx); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">פתח את {{selLabel}}</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#d67d09","options":["#d67d09","#eb931c","#f5f5f5","#38bdf8"],"section":"צבעים"},"button":{"editor":"color","default":"#3e3e3f","section":"צבעים"},"card":{"editor":"color","default":"#1c1c1e","section":"צבעים"},"background":{"editor":"color","default":"#000000","section":"צבעים"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'days', y: 2026, m: 10, sel: '2026-11-24' };
  }
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const L = theme === 'light' ? 'Light' : '';
    const MN = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
    const { view, y, m, sel } = this.state;
    const today = '2026-11-24';
    const iso = (yy, mm, dd) => yy + '-' + String(mm + 1).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
    const winStart = '2026-10-15', winEnd = '2026-12-31';
    const blocked = ['2026-11-13'];
    const projection = ['2026-11-06', '2026-11-20', '2026-11-27'];
    const inWin = (d) => d >= winStart && d <= winEnd;
    const logged = (d) => d >= '2026-10-15' && d < today && !blocked.includes(d);
    const first = new Date(y, m, 1).getDay();
    const dim = new Date(y, m + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < first; i++) cells.push({ n: '', vis: 'hidden', disabled: true, aria: '', pick: null, fw: 500, bg: 'transparent', fg: 'var(--tx)', bs: 'solid', bc: 'transparent', td: 'none', dot: 'transparent' });
    for (let d = 1; d <= dim; d++) {
      const k = iso(y, m, d);
      const isSel = k === sel, isToday = k === today, isBlocked = blocked.includes(k), isProj = projection.includes(k), active = inWin(k);
      const usable = active || isProj;
      cells.push({
        n: d, vis: 'visible', disabled: !usable,
        aria: d + ' ' + MN[m] + (isBlocked ? ', חסום להזנה' : '') + (isProj ? ', יום תשקיף' : ''),
        pick: usable ? () => this.setState({ sel: k }) : null,
        fw: isSel || isToday ? 700 : 500,
        bg: isSel ? 'var(--acc)' : 'transparent',
        fg: isSel ? '#0a0a0a' : (usable && !isBlocked ? 'var(--tx)' : 'var(--tx3)'),
        bs: isProj && !isSel ? 'dashed' : 'solid',
        bc: isSel ? 'var(--acc)' : (isToday ? 'var(--tx)' : (isProj ? 'var(--tx2)' : 'transparent')),
        td: isBlocked ? 'line-through' : 'none',
        dot: logged(k) && !isSel ? 'var(--tx2)' : 'transparent'
      });
    }
    const monthActive = (yy, mm) => iso(yy, mm, new Date(yy, mm + 1, 0).getDate()) >= winStart && iso(yy, mm, 1) <= winEnd;
    const months = MN.map((name, i) => {
      const on = i === m;
      const act = monthActive(y, i);
      return {
        name, on: on ? 'true' : 'false', fw: on ? 700 : 500,
        bg: on ? 'var(--inv)' : 'transparent',
        fg: on ? 'var(--invtx)' : (act ? 'var(--tx)' : 'var(--tx3)'),
        bd: on ? 'var(--inv)' : (act ? 'var(--line2)' : 'var(--line)'),
        pick: () => this.setState({ m: i, view: 'days' })
      };
    });
    const years = [2025, 2026, 2027].map((yy) => ({
      y: yy, on: yy === y ? 'true' : 'false',
      bg: yy === y ? 'var(--inv)' : 'var(--s2)', fg: yy === y ? 'var(--invtx)' : 'var(--tx)',
      pick: () => this.setState({ y: yy })
    }));
    const isDays = view === 'days';
    const sp = sel.split('-');
    return {
      themeClass: theme,
      acc: this.props.accent ?? '#d67d09',
      btn: this.props.button ?? (theme === 'light' ? '#2c2c2e' : '#3e3e3f'),
      card: this.props.card ?? (theme === 'light' ? '#ffffff' : '#1c1c1e'),
      bgc: this.props.background ?? (theme === 'light' ? '#f2f2f4' : '#000000'),
      homeHref: (L ? 'MainLight' : 'Main') + '.dc.html',
      isDays, isMonths: !isDays, pickerOpen: isDays ? 'false' : 'true',
      chevRot: isDays ? 'none' : 'rotate(180deg)',
      title: isDays ? MN[m] + ' ' + y : 'בחר חודש ושנה',
      prevLabel: isDays ? 'חודש קודם' : 'שנה קודמת',
      nextLabel: isDays ? 'חודש הבא' : 'שנה הבאה',
      prev: () => isDays ? this.setState(m === 0 ? { m: 11, y: y - 1 } : { m: m - 1 }) : this.setState({ y: y - 1 }),
      next: () => isDays ? this.setState(m === 11 ? { m: 0, y: y + 1 } : { m: m + 1 }) : this.setState({ y: y + 1 }),
      toggleView: () => this.setState({ view: isDays ? 'months' : 'days' }),
      goToday: () => this.setState({ view: 'days', y: 2026, m: 10, sel: today }),
      cells, months, years,
      selLabel: sel === today ? 'היום' : (+sp[2]) + ' ב' + MN[+sp[1] - 1]
    };
  }
}
</script>
</body>
</html>
