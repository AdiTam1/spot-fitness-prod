<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg-canvas:#08090c;--bg-surface-1:#101218;--bg-surface-2:#161922;--bg-surface-3:#1e222e;--bg-glass:#101218d1;--border-subtle:#ffffff0f;--border-strong:#ffffff1f;--border-accent:#d67d0973;--text-primary:#f4f6fb;--text-secondary:#949bb0;--text-muted:#5e6578;--accent-orange:#d67d09;--accent-volt:#d67d09;--accent-orange-bright:#eb931c;--accent-volt-soft:#d67d0924;--orange-0:#fef5e7;--orange-1:#fae8cb;--orange-2:#f4cf97;--orange-3:#eeb45f;--orange-4:#e99c2f;--orange-5:#e68e13;--orange-6:#d67d09;--orange-7:#be6c03;--orange-8:#a95f00;--orange-9:#935000;--macro-protein:#38bdf8;--macro-protein-soft:#38bdf824;--macro-carbs:#ff5e7e;--macro-carbs-soft:#ff5e7e24;--macro-fat:#ff8c1a;--macro-fat-soft:#ff8c1a24;--status-ok:#22c55e;--status-warn:#f59e0b;--status-danger:#ef4444;--shadow-card:inset 0 1px 0 0 rgba(255, 255, 255, 0.05), 0 8px 24px -8px rgba(0, 0, 0, 0.5);--shadow-card-elevated:inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 20px 40px -15px rgba(0, 0, 0, 0.7);--shadow-button-hover:0 6px 20px -4px rgba(214, 125, 9, 0.45);--shadow-dock:0 20px 45px -10px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);--space-xs:10px;--space-sm:12px;--space-md:16px;--space-lg:20px;--space-xl:32px;--radius-sm:12px;--radius-md:20px;--radius-lg:24px;--radius-pill:999px;--font-sans:'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;--font-mono:'Space Grotesk', 'Heebo', sans-serif;}}</style>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Spot Fitness – ניתוח תמונה</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300..800&amp;family=Space+Grotesk:wght@500..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{--acc:#d67d09;--p:#38bdf8;--c:#ff5e7e;--f:#ff8c1a;font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app.dark{--bg:#000000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f5f5f5;--tx2:#a8a8a8;--tx3:#8e8e93;--inv:#3e3e3f;--invtx:#ffffff;--glass:rgba(44,44,46,.52);--glass-b:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.22);--shadow:0 14px 34px -10px rgba(0,0,0,.8)}
.app.light{--bg:#f2f2f4;--s1:#ffffff;--s2:#f2f2f4;--s3:#e5e5e8;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--tx:#0a0a0a;--tx2:#5a5a5e;--tx3:#6e6e73;--inv:#2c2c2e;--invtx:#ffffff;--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,1);--shadow:0 14px 34px -12px rgba(0,0,0,.22)}
.glass{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.05),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08));pointer-events:none;z-index:-1}
.photo-glass{position:relative;isolation:isolate;background:rgba(30,30,30,.42);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px -6px rgba(0,0,0,.6);color:#fff}
.num{font-family:'Space Grotesk','Heebo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div class="app {{themeClass}}" dir="rtl" lang="he" style="--acc: {{acc}}; --inv: {{btn}}; --s1: {{card}}; --bg: {{bgc}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--tx)">

<div role="img" aria-label="תמונת הצלחת שצולמה, עם סימון המנות שזוהו" style="position: absolute; top: 0; left: 0; right: 0; height: 400px; background: radial-gradient(circle at 50% 45%, #3a3a3a 0%, #1f1f1f 55%, #111 100%)">
<div aria-hidden="true" style="position: absolute; top: 70px; left: 70px; width: 250px; height: 250px; border-radius: 999px; background: radial-gradient(circle, #e9e6e0 0%, #d9d5cd 62%, #bdb8ae 64%, #cfcac1 70%, #9d988f 100%); box-shadow: 0 30px 60px -20px rgba(0,0,0,.8)"></div>
<div aria-hidden="true" style="position: absolute; top: 120px; left: 105px; width: 105px; height: 80px; border-radius: 40px 50px 45px 35px; background: linear-gradient(150deg, #c98b4a, #8f5527)"></div>
<div aria-hidden="true" style="position: absolute; top: 205px; left: 115px; width: 115px; height: 70px; border-radius: 50px; background: radial-gradient(circle at 40% 40%, #fbfaf6, #e4e0d6)"></div>
<div aria-hidden="true" style="position: absolute; top: 130px; left: 210px; width: 80px; height: 120px; border-radius: 45px; background: radial-gradient(circle at 30% 30%, #9cc56b, #4f7a2c 70%)"></div>

<span class="photo-glass" style="position: absolute; top: 112px; right: 210px; height: 30px; padding: 0 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 9px; background: #fff"></span>חזה עוף · 150 ג׳</span>
<span class="photo-glass" style="position: absolute; top: 268px; right: 200px; height: 30px; padding: 0 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 9px; background: #fff"></span>אורז · 120 ג׳</span>
<span class="photo-glass" style="position: absolute; top: 160px; right: 34px; height: 30px; padding: 0 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 9px; background: #fff"></span>סלט + טחינה</span>

<div style="position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between">
<a href="{{addHref}}" class="photo-glass" aria-label="סגירה" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.2"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<button class="photo-glass" style="height: 44px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>צלם שוב</button>
</div>
</div>

<section style="position: absolute; left: 0; right: 0; bottom: 0; top: 356px; background: var(--s1); border-radius: 32px 32px 0 0; padding: 22px 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: var(--tx2); display: flex; align-items: center; gap: 6px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: var(--acc)"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>זוהו 3 מנות</span>
<span style="display: flex; align-items: baseline; gap: 6px"><span class="num" style="font-size: 44px; font-weight: 700; line-height: 1">612</span><span style="font-size: 15px; color: var(--tx2)">קק״ל</span></span>
</div>
<button class="glass" style="height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px">צהריים · 13:20<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div role="img" aria-label="חלבון 48 גרם, פחמימות 62 גרם, שומן 18 גרם" style="display: flex; height: 8px; gap: 3px">
<span style="flex: 48; border-radius: 9px; background: var(--p)"></span>
<span style="flex: 62; border-radius: 9px; background: var(--c)"></span>
<span style="flex: 40; border-radius: 9px; background: var(--f)"></span>
</div>
<div style="display: flex; gap: 16px; font-size: 13px; color: var(--tx2)">
<span>חלבון <span class="num" style="color: var(--tx); font-weight: 600">48</span> ג׳</span>
<span>פחמימות <span class="num" style="color: var(--tx); font-weight: 600">62</span> ג׳</span>
<span>שומן <span class="num" style="color: var(--tx); font-weight: 600">18</span> ג׳</span>
</div>
</div>

<div style="display: flex; flex-direction: column">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line)">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600">{{it.name}}</span>
<span class="num" style="font-size: 13px; color: var(--tx2)">{{it.kcal}} קק״ל</span>
</span>
<span style="display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--s2)">
<button aria-label="הפחת כמות" style="width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.2"><path d="M5 12h14"></path></svg></button>
<span class="num" style="min-width: 62px; text-align: center; font-size: 14px; font-weight: 600">{{it.qty}}</span>
<button aria-label="הגדל כמות" style="width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.2"><path d="M12 5v14M5 12h14"></path></svg></button>
</span>
</div>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; gap: 10px">
<button class="glass" style="height: 54px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; flex: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>תקן בקול</button>
<a href="{{homeHref}}" style="flex: 1; height: 54px; border-radius: 999px; background: var(--inv); color: var(--invtx); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">שמור ארוחה</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "accent": {"editor": "color", "default": "#d67d09", "options": ["#d67d09", "#eb931c", "#f5f5f5", "#38bdf8"], "section": "צבעים"}, "button": {"editor": "color", "default": "#3e3e3f", "section": "צבעים"}, "card": {"editor": "color", "default": "#1c1c1e", "section": "צבעים"}, "background": {"editor": "color", "default": "#000000", "section": "צבעים"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const L = theme === 'light' ? 'Light' : '';
    return {
      themeClass: theme,
      acc: this.props.accent ?? '#d67d09',
      btn: this.props.button ?? (theme === 'light' ? '#2c2c2e' : '#3e3e3f'),
      card: this.props.card ?? (theme === 'light' ? '#ffffff' : '#1c1c1e'),
      bgc: this.props.background ?? (theme === 'light' ? '#f2f2f4' : '#000000'),
      addHref: 'AddMeal' + L + '.dc.html',
      homeHref: (L ? 'MainLight' : 'Main') + '.dc.html',
      items: [
        { name: 'חזה עוף בגריל', kcal: 248, qty: '150 ג׳' },
        { name: 'אורז לבן', kcal: 156, qty: '120 ג׳' },
        { name: 'סלט ירקות עם טחינה', kcal: 208, qty: '1 קערה' }
      ]
    };
  }
}
</script>
</body>
</html>
