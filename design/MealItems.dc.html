<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg-canvas:#08090c;--bg-surface-1:#101218;--bg-surface-2:#161922;--bg-surface-3:#1e222e;--bg-glass:#101218d1;--border-subtle:#ffffff0f;--border-strong:#ffffff1f;--border-accent:#d67d0973;--text-primary:#f4f6fb;--text-secondary:#949bb0;--text-muted:#5e6578;--accent-orange:#d67d09;--accent-volt:#d67d09;--accent-orange-bright:#eb931c;--accent-volt-soft:#d67d0924;--orange-0:#fef5e7;--orange-1:#fae8cb;--orange-2:#f4cf97;--orange-3:#eeb45f;--orange-4:#e99c2f;--orange-5:#e68e13;--orange-6:#d67d09;--orange-7:#be6c03;--orange-8:#a95f00;--orange-9:#935000;--macro-protein:#38bdf8;--macro-protein-soft:#38bdf824;--macro-carbs:#ff5e7e;--macro-carbs-soft:#ff5e7e24;--macro-fat:#ff8c1a;--macro-fat-soft:#ff8c1a24;--status-ok:#22c55e;--status-warn:#f59e0b;--status-danger:#ef4444;--shadow-card:inset 0 1px 0 0 rgba(255, 255, 255, 0.05), 0 8px 24px -8px rgba(0, 0, 0, 0.5);--shadow-card-elevated:inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 20px 40px -15px rgba(0, 0, 0, 0.7);--shadow-button-hover:0 6px 20px -4px rgba(214, 125, 9, 0.45);--shadow-dock:0 20px 45px -10px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);--space-xs:10px;--space-sm:12px;--space-md:16px;--space-lg:20px;--space-xl:32px;--radius-sm:12px;--radius-md:20px;--radius-lg:24px;--radius-pill:999px;--font-sans:'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;--font-mono:'Space Grotesk', 'Heebo', sans-serif;}}</style>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Spot Fitness – מרכיבי הארוחה</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300..800&amp;family=Space+Grotesk:wght@500..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit}
.app{--acc:#d67d09;--p:#38bdf8;--c:#ff5e7e;--f:#ff8c1a;font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app.dark{--bg:#000000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f5f5f5;--tx2:#a8a8a8;--tx3:#8e8e93;--inv:#3e3e3f;--invtx:#ffffff;--glass:rgba(44,44,46,.52);--glass-b:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.22);--shadow:0 14px 34px -10px rgba(0,0,0,.8);--scrim:rgba(0,0,0,.55)}
.app.light{--bg:#f2f2f4;--s1:#ffffff;--s2:#f2f2f4;--s3:#e5e5e8;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--tx:#0a0a0a;--tx2:#5a5a5e;--tx3:#6e6e73;--inv:#2c2c2e;--invtx:#ffffff;--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,1);--shadow:0 14px 34px -12px rgba(0,0,0,.22);--scrim:rgba(20,20,22,.28)}
.glass{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.05),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08));pointer-events:none;z-index:-1}
.tint{background:color-mix(in srgb,var(--acc) 88%,transparent);border-color:rgba(255,200,130,.55);color:#0a0a0a}
.num{font-family:'Space Grotesk','Heebo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</helmet>
<div class="app {{themeClass}}" dir="rtl" lang="he" style="--acc: {{acc}}; --inv: {{btn}}; --s1: {{card}}; --bg: {{bgc}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--tx)">

<div style="box-sizing: border-box; height: 100%; padding: 20px 20px 26px; display: flex; flex-direction: column; gap: 14px">
<header style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 12px"><a href="{{hAdd}}" class="glass" aria-label="חזרה" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.2"><path d="M9 6l6 6-6 6"></path></svg></a><span style="display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 22px; font-weight: 700">ארוחת צהריים</h1><span style="font-size: 13px; color: var(--tx2)">3 מרכיבים · 13:20</span></span></span>
<a href="{{hTime}}" class="glass" style="height: 40px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>שעה</a>
</header>
<div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 20px; background: var(--s1); border: 1px solid var(--line)">
<span role="img" aria-label="תמונת הארוחה" style="width: 64px; height: 64px; border-radius: 14px; background: radial-gradient(circle at 40% 40%, #e9e6e0, #9d988f); flex: none"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">תמונת ארוחה</span><span style="font-size: 12px; color: var(--tx2); display: flex; align-items: center; gap: 4px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 13px; height: 13px; color: var(--acc)"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>פוענח ע״י AI</span></span>
<a href="{{hPhoto}}" style="height: 36px; padding: 0 12px; border-radius: 999px; background: var(--s2); font-size: 13px; font-weight: 600; display: flex; align-items: center">צפה</a>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 4px 2px 0">
<span><span class="num" style="font-size: 32px; font-weight: 700">612</span> <span style="font-size: 13px; color: var(--tx2)">קק״ל</span></span>
<span style="font-size: 13px; color: var(--tx2)">ח׳ <span class="num" style="color: var(--tx); font-weight: 600">48</span> · פ׳ <span class="num" style="color: var(--tx); font-weight: 600">62</span> · ש׳ <span class="num" style="color: var(--tx); font-weight: 600">18</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px; border-radius: 20px; background: var(--s1); border: 1px solid var(--line)">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 600">{{it.name}}</span>
<span style="font-size: 12px; color: var(--tx2)"><span class="num">{{it.qty}}</span> · <span class="num" style="color: var(--tx); font-weight: 600">{{it.kcal}}</span> קק״ל · ח׳ <span class="num">{{it.p}}</span></span>
</span>
<button aria-label="ערוך {{it.name}}" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M4 20l4-1 11-11-3-3L5 16z"></path></svg></button>
<button aria-label="מחק {{it.name}}" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg></button>
</div>
</sc-for>
</div>
<a href="{{hAdd}}" class="glass" style="height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.4"><path d="M12 5v14M5 12h14"></path></svg>הוסף עוד פריטים</a>
<div style="margin-top: auto"><a href="{{homeHref}}" style="height: 56px; border-radius: 999px; background: var(--inv); color: var(--invtx); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; width: 100%">שמור ארוחה</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "accent": {"editor": "color", "default": "#d67d09", "options": ["#d67d09", "#eb931c", "#f5f5f5", "#38bdf8"], "section": "צבעים"}, "button": {"editor": "color", "default": "#3e3e3f", "section": "צבעים"}, "card": {"editor": "color", "default": "#1c1c1e", "section": "צבעים"}, "background": {"editor": "color", "default": "#000000", "section": "צבעים"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const L = theme === 'light' ? 'Light' : '';
    const H = (n) => n + L + '.dc.html';
    const base = {
      themeClass: theme,
      acc: this.props.accent ?? '#d67d09',
      btn: this.props.button ?? (theme === 'light' ? '#2c2c2e' : '#3e3e3f'),
      card: this.props.card ?? (theme === 'light' ? '#ffffff' : '#1c1c1e'),
      bgc: this.props.background ?? (theme === 'light' ? '#f2f2f4' : '#000000'),
      homeHref: (L ? 'MainLight' : 'Main') + '.dc.html'
    };
    const x = (() => { return { hAdd: H('AddMeal'), hTime: H('MealTime'), hPhoto: H('PhotoResult'), items: [ { name: 'חזה עוף בגריל', qty: '150 ג׳', kcal: 248, p: 46 }, { name: 'אורז לבן', qty: '120 ג׳', kcal: 156, p: 3 }, { name: 'סלט ירקות עם טחינה', qty: '1 קערה', kcal: 208, p: 6 } ] }; })();
    return Object.assign(base, x);
  }
}
</script>
</body>
</html>
