<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg-canvas:#08090c;--bg-surface-1:#101218;--bg-surface-2:#161922;--bg-surface-3:#1e222e;--bg-glass:#101218d1;--border-subtle:#ffffff0f;--border-strong:#ffffff1f;--border-accent:#d67d0973;--text-primary:#f4f6fb;--text-secondary:#949bb0;--text-muted:#5e6578;--accent-orange:#d67d09;--accent-volt:#d67d09;--accent-orange-bright:#eb931c;--accent-volt-soft:#d67d0924;--orange-0:#fef5e7;--orange-1:#fae8cb;--orange-2:#f4cf97;--orange-3:#eeb45f;--orange-4:#e99c2f;--orange-5:#e68e13;--orange-6:#d67d09;--orange-7:#be6c03;--orange-8:#a95f00;--orange-9:#935000;--macro-protein:#38bdf8;--macro-protein-soft:#38bdf824;--macro-carbs:#ff5e7e;--macro-carbs-soft:#ff5e7e24;--macro-fat:#ff8c1a;--macro-fat-soft:#ff8c1a24;--status-ok:#22c55e;--status-warn:#f59e0b;--status-danger:#ef4444;--shadow-card:inset 0 1px 0 0 rgba(255, 255, 255, 0.05), 0 8px 24px -8px rgba(0, 0, 0, 0.5);--shadow-card-elevated:inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 20px 40px -15px rgba(0, 0, 0, 0.7);--shadow-button-hover:0 6px 20px -4px rgba(214, 125, 9, 0.45);--shadow-dock:0 20px 45px -10px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);--space-xs:10px;--space-sm:12px;--space-md:16px;--space-lg:20px;--space-xl:32px;--radius-sm:12px;--radius-md:20px;--radius-lg:24px;--radius-pill:999px;--font-sans:'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;--font-mono:'Space Grotesk', 'Heebo', sans-serif;}}</style>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Spot Fitness – תיאור ארוחה</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300..800&amp;family=Space+Grotesk:wght@500..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{--acc:#d67d09;--p:#38bdf8;--c:#ff5e7e;--f:#ff8c1a;font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app.dark{--bg:#000000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f5f5f5;--tx2:#a8a8a8;--tx3:#8e8e93;--inv:#3e3e3f;--invtx:#ffffff;--glass:rgba(44,44,46,.52);--glass-b:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.22);--shadow:0 14px 34px -10px rgba(0,0,0,.8)}
.app.light{--bg:#f2f2f4;--s1:#ffffff;--s2:#f2f2f4;--s3:#e5e5e8;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--tx:#0a0a0a;--tx2:#5a5a5e;--tx3:#6e6e73;--inv:#2c2c2e;--invtx:#ffffff;--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,1);--shadow:0 14px 34px -12px rgba(0,0,0,.22)}
.glass{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.05),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08));pointer-events:none;z-index:-1}
.tint{background:color-mix(in srgb,var(--acc) 88%,transparent);border-color:rgba(255,200,130,.55);color:#0a0a0a}
.num{font-family:'Space Grotesk','Heebo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div class="app {{themeClass}}" dir="rtl" lang="he" style="--acc: {{acc}}; --inv: {{btn}}; --s1: {{card}}; --bg: {{bgc}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--tx); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; gap: 20px">

<header style="display: flex; align-items: center; justify-content: space-between">
<a href="{{addHref}}" class="glass" aria-label="סגירה" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.2"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div class="glass" style="height: 44px; padding: 0 6px; border-radius: 999px; display: flex; align-items: center; gap: 2px">
<button style="height: 34px; padding: 0 14px; border-radius: 999px; background: var(--line2); font-size: 14px; font-weight: 600">טקסט</button>
<button style="height: 34px; padding: 0 14px; border-radius: 999px; font-size: 14px; color: var(--tx2)">מספרים</button>
</div>
</header>

<div style="display: flex; flex-direction: column; gap: 10px; padding-top: 8px">
<label for="ql-text" style="font-size: 13px; color: var(--tx2)">מה אכלת? כתוב כמו להודעה</label>
<textarea id="ql-text" rows="3" style="font: inherit; font-size: 28px; font-weight: 500; line-height: 1.3; color: var(--tx); background: transparent; border: 0; outline: none; resize: none; padding: 0; caret-color: var(--acc)">חביתה משתי ביצים, שתי פרוסות לחם מלא וסלט קצוץ</textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: var(--acc)"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>זיהינו — לחץ על פריט לעריכה</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<button style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: var(--s1); border: 1px solid var(--line); text-align: right">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">{{it.name}}</span>
<span style="font-size: 13px; color: var(--tx2)">{{it.qty}}</span>
</span>
<span class="num" style="font-size: 16px; font-weight: 600">{{it.kcal}}</span>
</button>
</sc-for>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 4px 0">
<span style="display: flex; gap: 12px; font-size: 13px; color: var(--tx2)">
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 6px; height: 6px; border-radius: 9px; background: var(--p)"></span>ח <span class="num" style="color: var(--tx); font-weight: 600">24</span></span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 6px; height: 6px; border-radius: 9px; background: var(--c)"></span>פ <span class="num" style="color: var(--tx); font-weight: 600">34</span></span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 6px; height: 6px; border-radius: 9px; background: var(--f)"></span>ש <span class="num" style="color: var(--tx); font-weight: 600">17</span></span>
</span>
<span><span class="num" style="font-size: 22px; font-weight: 700">385</span> <span style="font-size: 13px; color: var(--tx2)">קק״ל</span></span>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button class="glass" style="height: 40px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 17px; height: 17px"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>היום, 13:20</button>
<button class="glass" style="height: 40px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 17px; height: 17px"><path d="M3 11h18a9 9 0 0 1-18 0z"></path></svg>צהריים</button>
<button class="glass" aria-label="צרף תמונה" style="width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 17px; height: 17px"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<button class="glass tint" aria-label="הקלט במקום להקליד" style="width: 64px; height: 64px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px; stroke-width: 2"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<a href="{{homeHref}}" style="flex: 1; height: 64px; border-radius: 999px; background: var(--inv); color: var(--invtx); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">שמור · 385 קק״ל</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "accent": {"editor": "color", "default": "#d67d09", "options": ["#d67d09", "#eb931c", "#f5f5f5", "#38bdf8"], "section": "צבעים"}, "button": {"editor": "color", "default": "#3e3e3f", "section": "צבעים"}, "card": {"editor": "color", "default": "#1c1c1e", "section": "צבעים"}, "background": {"editor": "color", "default": "#000000", "section": "צבעים"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const L = theme === 'light' ? 'Light' : '';
    return {
      themeClass: theme,
      acc: this.props.accent ?? '#d67d09',
      btn: this.props.button ?? (theme === 'light' ? '#2c2c2e' : '#3e3e3f'),
      card: this.props.card ?? (theme === 'light' ? '#ffffff' : '#1c1c1e'),
      bgc: this.props.background ?? (theme === 'light' ? '#f2f2f4' : '#000000'),
      addHref: 'AddMeal' + L + '.dc.html',
      homeHref: (L ? 'MainLight' : 'Main') + '.dc.html',
      items: [
        { name: 'חביתה', qty: '2 ביצים · כף שמן', kcal: 180 },
        { name: 'לחם מלא', qty: '2 פרוסות', kcal: 160 },
        { name: 'סלט קצוץ', qty: 'קערה בינונית', kcal: 45 }
      ]
    };
  }
}
</script>
</body>
</html>
