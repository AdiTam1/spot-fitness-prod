<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg-canvas:#08090c;--bg-surface-1:#101218;--bg-surface-2:#161922;--bg-surface-3:#1e222e;--bg-glass:#101218d1;--border-subtle:#ffffff0f;--border-strong:#ffffff1f;--border-accent:#d67d0973;--text-primary:#f4f6fb;--text-secondary:#949bb0;--text-muted:#5e6578;--accent-orange:#d67d09;--accent-volt:#d67d09;--accent-orange-bright:#eb931c;--accent-volt-soft:#d67d0924;--orange-0:#fef5e7;--orange-1:#fae8cb;--orange-2:#f4cf97;--orange-3:#eeb45f;--orange-4:#e99c2f;--orange-5:#e68e13;--orange-6:#d67d09;--orange-7:#be6c03;--orange-8:#a95f00;--orange-9:#935000;--macro-protein:#38bdf8;--macro-protein-soft:#38bdf824;--macro-carbs:#ff5e7e;--macro-carbs-soft:#ff5e7e24;--macro-fat:#ff8c1a;--macro-fat-soft:#ff8c1a24;--status-ok:#22c55e;--status-warn:#f59e0b;--status-danger:#ef4444;--shadow-card:inset 0 1px 0 0 rgba(255, 255, 255, 0.05), 0 8px 24px -8px rgba(0, 0, 0, 0.5);--shadow-card-elevated:inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 20px 40px -15px rgba(0, 0, 0, 0.7);--shadow-button-hover:0 6px 20px -4px rgba(214, 125, 9, 0.45);--shadow-dock:0 20px 45px -10px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);--space-xs:10px;--space-sm:12px;--space-md:16px;--space-lg:20px;--space-xl:32px;--radius-sm:12px;--radius-md:20px;--radius-lg:24px;--radius-pill:999px;--font-sans:'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;--font-mono:'Space Grotesk', 'Heebo', sans-serif;}}</style>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Spot Fitness – יומן, פעילות</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300..800&amp;family=Space+Grotesk:wght@500..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{--acc:#d67d09;--p:#38bdf8;--c:#ff5e7e;--f:#ff8c1a;font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app.dark{--bg:#000000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f5f5f5;--tx2:#a8a8a8;--tx3:#8e8e93;--inv:#3e3e3f;--invtx:#ffffff;--glass:rgba(44,44,46,.52);--glass-b:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.22);--shadow:0 14px 34px -10px rgba(0,0,0,.8)}
.app.light{--bg:#f2f2f4;--s1:#ffffff;--s2:#f2f2f4;--s3:#e5e5e8;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--tx:#0a0a0a;--tx2:#5a5a5e;--tx3:#6e6e73;--inv:#2c2c2e;--invtx:#ffffff;--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,1);--shadow:0 14px 34px -12px rgba(0,0,0,.22)}
.glass{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.05),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08));pointer-events:none;z-index:-1}
.tint{background:color-mix(in srgb,var(--acc) 88%,transparent);border-color:rgba(255,200,130,.55);color:#0a0a0a}
.num{font-family:'Space Grotesk','Heebo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div class="app {{themeClass}}" dir="rtl" lang="he" style="--acc: {{acc}}; --inv: {{btn}}; --s1: {{card}}; --bg: {{bgc}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--tx)">
<div style="padding: 92px 20px 150px; display: flex; flex-direction: column; gap: 14px">

<section aria-label="ביצוע שבועי" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{week}}" as="w" hint-placeholder-count="4">
<div style="background: var(--s1); border: 1px solid var(--line); border-radius: 20px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="position: relative; width: 44px; height: 44px">
<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--s3)" stroke-width="5"></circle><circle cx="22" cy="22" r="18" fill="none" stroke="var(--tx)" stroke-width="5" stroke-linecap="round" stroke-dasharray="{{w.dash}}" transform="rotate(-90 22 22)"></circle></svg>
<span class="num" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{w.v}}</span>
</div>
<span style="font-size: 12px; color: var(--tx2)">{{w.l}}</span>
</div>
</sc-for>
</section>

<section aria-label="צעדים" style="background: var(--s1); border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M8 4c2 0 3 2 3 5s-1 5-3 5-3-2-3-5 1-5 3-5zM16 10c2 0 3 2 3 5s-1 5-3 5-3-2-3-5 1-5 3-5z"></path></svg>צעדים</span>
<span style="font-size: 12px; color: var(--tx2)">מסונכרן · Health Connect</span>
</div>
<div style="display: flex; align-items: baseline; gap: 6px"><span class="num" style="font-size: 30px; font-weight: 700; line-height: 1">6,412</span><span class="num" style="font-size: 14px; color: var(--tx2)">/ 8,000</span></div>
<div style="height: 6px; border-radius: 9px; background: var(--s3); overflow: hidden"><div style="width: 80%; height: 100%; border-radius: 9px; background: var(--tx)"></div></div>
</section>

<section aria-label="אימון היום" style="background: var(--s1); border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 15px; font-weight: 600">אימון היום</span>
<span style="font-size: 12px; color: var(--tx2)">השבוע: <span class="num" style="color: var(--tx); font-weight: 600">2</span> אימונים</span>
</div>
<div role="radiogroup" aria-label="סוג אימון" style="display: flex; gap: 8px">
<button role="radio" aria-checked="true" style="height: 40px; padding: 0 14px; border-radius: 999px; background: var(--acc); color: #0a0a0a; font-size: 14px; font-weight: 600">אימון כוח A</button>
<button role="radio" aria-checked="false" style="height: 40px; padding: 0 14px; border-radius: 999px; background: var(--s2); font-size: 14px">אימון כוח B</button>
<button role="radio" aria-checked="false" style="height: 40px; padding: 0 14px; border-radius: 999px; background: var(--s2); font-size: 14px; color: var(--tx2)">לא התאמנתי</button>
</div>
</section>

<section aria-label="הליכה או ריצה" style="background: var(--s1); border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 15px; font-weight: 600">הליכה / ריצה</span>
<span style="font-size: 12px; color: var(--tx2)">יעד: <span class="num" style="color: var(--tx); font-weight: 600">30</span> דק׳</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 44px; border-radius: 14px; background: var(--s2); font-size: 14px">הליכה · 30 דק׳</button>
<button style="height: 44px; border-radius: 14px; background: var(--acc); color: #0a0a0a; font-size: 14px; font-weight: 600">הליכה מהירה · 45 דק׳</button>
<button style="height: 44px; border-radius: 14px; background: var(--s2); font-size: 14px">ריצה · 25 דק׳</button>
<button style="height: 44px; border-radius: 14px; background: var(--s2); font-size: 14px">ריצה · 40 דק׳</button>
</div>
</section>

<section aria-label="שינה" style="background: var(--s1); border: 1px solid var(--line); border-radius: 24px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">שינה</span><span style="font-size: 12px; color: var(--tx2)">כמה שעות ישנת הלילה?</span></span>
<span style="display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--s2)">
<button aria-label="פחות" style="width: 38px; height: 38px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.2"><path d="M5 12h14"></path></svg></button>
<span class="num" style="min-width: 54px; text-align: center; font-size: 17px; font-weight: 700">7.5</span>
<button aria-label="יותר" style="width: 38px; height: 38px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.2"><path d="M12 5v14M5 12h14"></path></svg></button>
</span>
</section>

<section aria-label="כרטיס ארוחה" style="background: var(--s1); border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">ארוחה 3 · ערב</span><span style="font-size: 12px; color: var(--tx2)">יעד מהתפריט: <span class="num">620</span> קק״ל</span></span>
<span style="font-size: 12px; color: var(--tx3)">טרם נרשמה</span>
</div>
<div style="display: flex; gap: 8px">
<a href="{{addHref}}" style="flex: 1; height: 44px; border-radius: 999px; background: var(--inv); color: var(--invtx); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.4"><path d="M12 5v14M5 12h14"></path></svg>הוסף / ערוך</a>
<a href="{{photoHref}}" class="glass" style="height: 44px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>צילום AI</a>
<a href="{{addHref}}" class="glass" style="height: 44px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M7 4h10v16l-5-4-5 4z"></path></svg>שמורות</a>
</div>
</section>
</div>

<header class="glass" style="position: absolute; top: 12px; left: 12px; right: 12px; height: 64px; border-radius: 999px; padding: 0 8px 0 18px; display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700; line-height: 1.2">פעילות היום</span><span style="font-size: 12px; color: var(--tx2)">יום שלישי, 24.11</span></span>
<span role="radiogroup" aria-label="סוג יום" style="display: flex; padding: 3px; border-radius: 999px; background: var(--line)">
<button role="radio" aria-checked="true" style="height: 40px; padding: 0 14px; border-radius: 999px; background: var(--s1); font-size: 13px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.2)">יום אימון</button>
<button role="radio" aria-checked="false" style="height: 40px; padding: 0 14px; border-radius: 999px; font-size: 13px; color: var(--tx2)">מנוחה</button>
</span>
</header>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(to top, var(--bg), transparent); pointer-events: none"></div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; align-items: center; gap: 10px">
<nav class="glass" aria-label="ניווט ראשי" style="flex: 1; height: 66px; border-radius: 999px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px; gap: 2px">
<a href="{{journalHref}}" aria-current="page" style="border-radius: 999px; background: var(--line2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg><span style="font-size: 11px; font-weight: 600">יומן</span></a>
<a href="{{metricsHref}}" style="border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6"></path></svg><span style="font-size: 11px">מדדים</span></a>
<a href="{{profileHref}}" style="border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span style="font-size: 11px">פרופיל</span></a>
</nav>
<a href="{{addHref}}" class="glass tint" aria-label="הוספת ארוחה" style="width: 66px; height: 66px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px; stroke-width: 2.4"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "accent": {"editor": "color", "default": "#d67d09", "options": ["#d67d09", "#eb931c", "#f5f5f5", "#38bdf8"], "section": "צבעים"}, "button": {"editor": "color", "default": "#3e3e3f", "section": "צבעים"}, "card": {"editor": "color", "default": "#1c1c1e", "section": "צבעים"}, "background": {"editor": "color", "default": "#000000", "section": "צבעים"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const L = theme === 'light' ? 'Light' : '';
    const C = 113;
    const mk = (l, done) => ({ l, v: done + '/7', dash: Math.round(C * done / 7) + ' ' + C });
    return {
      themeClass: theme,
      acc: this.props.accent ?? '#d67d09',
      btn: this.props.button ?? (theme === 'light' ? '#2c2c2e' : '#3e3e3f'),
      card: this.props.card ?? (theme === 'light' ? '#ffffff' : '#1c1c1e'),
      bgc: this.props.background ?? (theme === 'light' ? '#f2f2f4' : '#000000'),
      journalHref: (L ? 'MainLight' : 'Main') + '.dc.html',
      addHref: 'AddMeal' + L + '.dc.html',
      photoHref: 'PhotoResult' + L + '.dc.html',
      metricsHref: 'Metrics' + L + '.dc.html',
      profileHref: 'Profile' + L + '.dc.html',
      week: [mk('אימונים', 2), mk('צעדים', 4), mk('הליכה', 3), mk('שינה', 5)]
    };
  }
}
</script>
</body>
</html>
