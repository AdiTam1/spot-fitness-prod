<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--bg-canvas:#08090c;--bg-surface-1:#101218;--bg-surface-2:#161922;--bg-surface-3:#1e222e;--bg-glass:#101218d1;--border-subtle:#ffffff0f;--border-strong:#ffffff1f;--border-accent:#d67d0973;--text-primary:#f4f6fb;--text-secondary:#949bb0;--text-muted:#5e6578;--accent-orange:#d67d09;--accent-volt:#d67d09;--accent-orange-bright:#eb931c;--accent-volt-soft:#d67d0924;--orange-0:#fef5e7;--orange-1:#fae8cb;--orange-2:#f4cf97;--orange-3:#eeb45f;--orange-4:#e99c2f;--orange-5:#e68e13;--orange-6:#d67d09;--orange-7:#be6c03;--orange-8:#a95f00;--orange-9:#935000;--macro-protein:#38bdf8;--macro-protein-soft:#38bdf824;--macro-carbs:#ff5e7e;--macro-carbs-soft:#ff5e7e24;--macro-fat:#ff8c1a;--macro-fat-soft:#ff8c1a24;--status-ok:#22c55e;--status-warn:#f59e0b;--status-danger:#ef4444;--shadow-card:inset 0 1px 0 0 rgba(255, 255, 255, 0.05), 0 8px 24px -8px rgba(0, 0, 0, 0.5);--shadow-card-elevated:inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 20px 40px -15px rgba(0, 0, 0, 0.7);--shadow-button-hover:0 6px 20px -4px rgba(214, 125, 9, 0.45);--shadow-dock:0 20px 45px -10px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);--space-xs:10px;--space-sm:12px;--space-md:16px;--space-lg:20px;--space-xl:32px;--radius-sm:12px;--radius-md:20px;--radius-lg:24px;--radius-pill:999px;--font-sans:'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;--font-mono:'Space Grotesk', 'Heebo', sans-serif;}}</style>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Spot Fitness – פרופיל</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300..800&amp;family=Space+Grotesk:wght@500..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.app{--acc:#d67d09;--p:#38bdf8;--c:#ff5e7e;--f:#ff8c1a;font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app.dark{--bg:#000000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f5f5f5;--tx2:#a8a8a8;--tx3:#8e8e93;--inv:#3e3e3f;--invtx:#ffffff;--glass:rgba(44,44,46,.52);--glass-b:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.22);--shadow:0 14px 34px -10px rgba(0,0,0,.8)}
.app.light{--bg:#f2f2f4;--s1:#ffffff;--s2:#f2f2f4;--s3:#e5e5e8;--line:rgba(0,0,0,.06);--line2:rgba(0,0,0,.1);--tx:#0a0a0a;--tx2:#5a5a5e;--tx3:#6e6e73;--inv:#2c2c2e;--invtx:#ffffff;--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,1);--shadow:0 14px 34px -12px rgba(0,0,0,.22)}
.glass{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.05),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08));pointer-events:none;z-index:-1}
.tint{background:color-mix(in srgb,var(--acc) 88%,transparent);border-color:rgba(255,200,130,.55);color:#0a0a0a}
.num{font-family:'Space Grotesk','Heebo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div class="app {{themeClass}}" dir="rtl" lang="he" style="--acc: {{acc}}; --inv: {{btn}}; --s1: {{card}}; --bg: {{bgc}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--tx)">
<div style="padding: 20px 20px 150px; display: flex; flex-direction: column; gap: 14px">

<section aria-label="פרטי משתמש" style="display: flex; align-items: center; gap: 14px; padding: 4px 0 6px">
<div style="width: 64px; height: 64px; border-radius: 999px; background: var(--s3); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex: none">רת</div>
<div style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 24px; font-weight: 700; line-height: 1.2">רותם</span>
<span style="font-size: 13px; color: var(--tx2)">מתאמן SPOT · מעקב תזונה</span>
</div>
<button class="glass" aria-label="שינוי שם משתמש" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M4 20l4-1 11-11-3-3L5 16z"></path></svg></button>
</section>

<section aria-label="סטטיסטיקות" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="background: var(--s1); border: 1px solid var(--line); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: var(--tx2)">{{s.l}}</span>
<span class="num" style="font-size: 22px; font-weight: 700">{{s.v}}</span>
<span style="font-size: 12px; color: var(--tx3)">{{s.sub}}</span>
</div>
</sc-for>
</section>

<section aria-label="קיצורי דרך בכרטיס הארוחה" style="background: var(--s1); border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; font-weight: 600">קיצורי דרך בכרטיס הארוחה</span>
<span class="num" style="font-size: 13px; color: var(--tx2)">{{activeCount}}/2 פעילים</span>
</div>
<span style="font-size: 12px; color: var(--tx2); margin-top: -6px">״הוסף / ערוך״ תמיד ראשון. בחר עד 2 נוספים.</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{shortcuts}}" as="sc" hint-placeholder-count="6">
<button aria-pressed="{{sc.on}}" onClick="{{sc.toggle}}" style="height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: {{sc.fw}}; background: {{sc.bg}}; color: {{sc.fg}}; border: 1px solid {{sc.bd}}; display: flex; align-items: center; gap: 6px"><sc-if value="{{sc.isOn}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.6"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>{{sc.label}}</button>
</sc-for>
</div>
</section>

<nav aria-label="הגדרות" style="background: var(--s1); border: 1px solid var(--line); border-radius: 24px; display: flex; flex-direction: column">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 56px; box-sizing: border-box">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">התראות</span><span style="font-size: 12px; color: var(--tx2)">מאושר במכשיר · שלח התראת בדיקה</span></span>
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: var(--tx3)"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="height: 1px; background: var(--line); margin-inline-start: 50px"></div>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 56px; box-sizing: border-box">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">הארוחות שלי</span><span style="font-size: 12px; color: var(--tx2)">היסטוריה וחיפוש לפי מאכל או תאריך</span></span>
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: var(--tx3)"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="height: 1px; background: var(--line); margin-inline-start: 50px"></div>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 56px; box-sizing: border-box">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 9h6M9 13h6M9 17h3"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">שאלון פרופיל והעדפות</span><span style="font-size: 12px; color: var(--tx2)">עדכון נתונים למאמן</span></span>
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: var(--tx3)"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
</nav>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(to top, var(--bg), transparent); pointer-events: none"></div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; align-items: center; gap: 10px">
<nav class="glass" aria-label="ניווט ראשי" style="flex: 1; height: 66px; border-radius: 999px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px; gap: 2px">
<a href="{{journalHref}}" style="border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg><span style="font-size: 11px">יומן</span></a>
<a href="{{metricsHref}}" style="border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--tx2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6"></path></svg><span style="font-size: 11px">מדדים</span></a>
<a href="#" aria-current="page" style="border-radius: 999px; background: var(--line2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span style="font-size: 11px; font-weight: 600">פרופיל</span></a>
</nav>
<a href="{{addHref}}" class="glass tint" aria-label="הוספת ארוחה" style="width: 66px; height: 66px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px; stroke-width: 2.4"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "accent": {"editor": "color", "default": "#d67d09", "options": ["#d67d09", "#eb931c", "#f5f5f5", "#38bdf8"], "section": "צבעים"}, "button": {"editor": "color", "default": "#3e3e3f", "section": "צבעים"}, "card": {"editor": "color", "default": "#1c1c1e", "section": "צבעים"}, "background": {"editor": "color", "default": "#000000", "section": "צבעים"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: ['ai-photo', 'saved-meals'] }; }
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const L = theme === 'light' ? 'Light' : '';
    const on = this.state.on;
    const opts = [
      { id: 'ai-recommend', label: 'מה לאכול?' },
      { id: 'saved-meals', label: 'ארוחות שמורות' },
      { id: 'ai-photo', label: 'צילום AI' },
      { id: 'ai-text', label: 'טקסט / קול' },
      { id: 'barcode', label: 'סריקת ברקוד' },
      { id: 'favorites', label: 'מועדפים' }
    ];
    const full = on.length >= 2;
    return {
      themeClass: theme,
      acc: this.props.accent ?? '#d67d09',
      btn: this.props.button ?? (theme === 'light' ? '#2c2c2e' : '#3e3e3f'),
      card: this.props.card ?? (theme === 'light' ? '#ffffff' : '#1c1c1e'),
      bgc: this.props.background ?? (theme === 'light' ? '#f2f2f4' : '#000000'),
      journalHref: (L ? 'MainLight' : 'Main') + '.dc.html',
      metricsHref: 'Metrics' + L + '.dc.html',
      addHref: 'AddMeal' + L + '.dc.html',
      activeCount: on.length,
      shortcuts: opts.map((o) => {
        const isOn = on.includes(o.id);
        return {
          label: o.label,
          on: isOn ? 'true' : 'false',
          isOn,
          bg: isOn ? 'var(--inv)' : 'transparent',
          fg: isOn ? 'var(--invtx)' : 'var(--tx)',
          bd: isOn ? 'var(--inv)' : 'var(--line2)',
          fw: isOn ? 700 : 500,
          toggle: () => this.setState({ on: isOn ? on.filter((x) => x !== o.id) : (full ? [on[1], o.id] : [...on, o.id]) })
        };
      }),
      stats: [
        { l: 'ממוצע קלורי וחלבון', v: '1,980', sub: '128 ג׳ חלבון ליום' },
        { l: 'ממוצע צעדים יומי', v: '7,120', sub: '30 הימים האחרונים' },
        { l: 'ממוצע מים יומי', v: '1.8 ל׳', sub: '7 כוסות בממוצע' },
        { l: 'שינוי משקל כולל', v: '−2.6 ק״ג', sub: 'יעד: 78 ק״ג' }
      ]
    };
  }
}
</script>
</body>
</html>
