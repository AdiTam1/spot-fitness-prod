<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>אין חיבור לאינטרנט — SPOT Fitness</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #08090c;
        color: #f4f6fb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #101218;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 22px;
        padding: 26px 22px;
        text-align: center;
      }
      .logo-img {
        width: 60px;
        height: 60px;
        border-radius: 16px;
        object-fit: cover;
        margin-bottom: 14px;
        box-shadow: 0 8px 22px rgba(214, 125, 9, 0.32);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 800;
      }
      p {
        margin: 0 0 20px;
        color: #949bb0;
        font-size: 14px;
        line-height: 1.55;
      }
      button {
        width: 100%;
        padding: 13px 16px;
        border: none;
        border-radius: 12px;
        background: #d67d09;
        color: #ffffff;
        font-weight: 800;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="./spot-logo.png" alt="SPOT Fitness" class="logo-img" />
      <h1>אין כרגע חיבור לאינטרנט</h1>
      <p>
        הטלפון לא מצליח להתחבר לשרת של SPOT. מד הצעדים ממשיך להיספר מקומית במכשיר ויסתנכרן ברגע שהקליטה תחזור.
      </p>
      <button type="button" onclick="window.location.href = 'https://spot-fitness-prod.vercel.app'">
        נסה להתחבר שוב
      </button>
    </div>
  </body>
</html>
